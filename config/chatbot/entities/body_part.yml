# body_part 엔티티 사전 (신체부위)
#
# 생성: ENTITY=body_part bin/rails chatbot:entities:build
#
# - match: token — DiseaseCase.burden_body_part(파이프로 이어진 값)의 토큰을 서버 필터와 같은 방식으로 센다.
#   필터가 토큰을 정확히 일치시키므로 db에는 '접두 없는 기본 토큰'을 적고, 좌우 접두 변형
#   (우측·좌측·양측)은 Chatbot::BodyPartExpansion이 붙여 준다. 왼쪽·오른쪽·양쪽 같은 드문 표기
#   (전체 토큰의 0.62%)는 검색 속도 때문에 붙이지 않는다.
# - 키(개념명)가 CSV의 '대표 엔트리'이자 챗봇이 서버로 보내는 body_part 값이다. 서버는 이 대표를
#   db 토큰들로 확장해 검색한다(BodyPartExpansion.tokens_for). 개념명을 바꾸면 서버 매핑도 바뀐다.
# - 개념 묶음(예: 어깨 = 어깨·견관절)은 작성자 판단이므로 전문가 검토가 필요하다.
# - 토큰은 개발 DB에서 신체부위가 있는 사례(40,846건)의 좌우 구분을 뗀 서로 다른 값 849개 중
#   빈도가 높은 것을 골랐다. 사전에 없는 값을 말하면 그 값 자체로 검색한다.
match: token
min_hits: 20
concepts:
  어깨:
    db: [어깨, 견관절, 어깨관절, 견갑, 견갑골, 양견관절]
    colloquial: [어깨 관절, 어깨뼈]
  허리:
    db: [허리, 요추, 요추부, 요부, 요천추]
    colloquial: [허리뼈, 허리 쪽]
  목:
    db: [목, 경추, 경추부, 고개, 뒷목]
    colloquial: [목덜미]
  등:
    db: [등, 흉추, 척추]
    colloquial: [등뼈, 등 쪽]
  팔꿈치:
    db: [팔꿈치, 주관절, 주관절(팔꿈치)]
    colloquial: [팔꿈치 관절]
  손목:
    db: [손목, 완관절, 수근관절, 수근부, 팔목, 손목관절, 손/손목]
    colloquial: [손목 관절]
  손:
    db: [손, 손가락, 수부, 수지, 엄지손가락, 엄지, 양손, 오른손, 손바닥, 수지부, 무지, 제1수지, 제2수지, 제3수지, 제4수지]
    colloquial: [손 쪽]
  팔:
    db: [팔, 위팔, 아래팔, 상완, 양팔, 상지, 전완, 전완부, 오른팔]
    colloquial: [팔 쪽]
  무릎:
    db: [무릎, 슬관절, 무릎관절, 슬관절(무릎)]
    colloquial: [무릎 관절]
  다리:
    db: [다리, 하지, 허벅지, 종아리, 대퇴부]
    colloquial: [다리 쪽]
  발목:
    db: [발목, 족관절, 아킬레스건]
    colloquial: [발목 관절]
  발:
    db: [발, 발바닥, 족부, 발가락]
    colloquial: [발 쪽]
  고관절:
    db: [고관절, 엉덩이, 골반, 둔부]
    colloquial: [엉덩이 관절]
  폐:
    db: [폐, 호흡기, 기관지, 흉막]
    colloquial: [폐 쪽, 숨쉬는 기관]
  귀:
    db: [귀]
    colloquial: [청각, 귀 쪽]
  눈:
    db: [눈]
    colloquial: [시력, 눈 쪽]
  머리:
    db: [머리, 뇌, 얼굴]
    colloquial: [머리 쪽, 두부]
  피부:
    db: [피부]
    colloquial: [피부 쪽]
  전신:
    db: [전신, 상체, 하체]
    colloquial: [온몸, 몸 전체]
