# disease_name 엔티티 사전 (카카오 챗봇 관리자센터 업로드용 CSV의 원본 데이터)
#
# 생성: ENTITY=disease_name bin/rails chatbot:entities:build
# 검증: bin/rails chatbot:entities:check
# 미등록 용어 찾기: ENTITY=disease_name bin/rails chatbot:entities:discover
#
# - 키(개념명)가 CSV의 '대표 엔트리'이자, 챗봇이 서버로 보내는 disease_name 값이다.
# - db: 실제 DB의 disease_name에 나타나는 표기 변형. 건수 측정과 (후속) 검색 확장에 쓴다.
#       공백은 무시하고 비교하므로 띄어쓰기 변형은 따로 적지 않아도 된다.
# - colloquial: 사용자가 말할 법한 표현. DB에 없어도 된다. 동의어로 업로드된다.
# - 한 표현을 두 개념에 중복해서 넣으면 카카오가 인식을 못 하므로 check가 막는다.
# - 의학적 동일성은 이 파일 작성자의 판단이므로 전문가 검토가 필요하다.
