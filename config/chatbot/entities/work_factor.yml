# work_factor 엔티티 사전 (업무 부담 요인)
#
# 생성: ENTITY=work_factor bin/rails chatbot:entities:build
#
# - match: fts — 서버(Chatbot::CaseSearch)가 work_factor를 q(전문 검색)로 보내므로, db에는 q 검색어를 적고
#   DiseaseCase.main_search(q:)로 건수를 잰다. 대표 엔트리 하나만 q로 보냈을 때와 변형 합집합을 비교한다.
# - 전문 검색은 '단어 전체'가 일치해야 걸린다. '반복', '반복적인', '반복적으로'는 서로 다른 단어라
#   변형을 따로 적어야 한다. 띄어쓰기로 구분한 검색어는 모든 단어가 있어야 한다(AND).
# - 검색 대상 컬럼은 job_name, job_description, main_reasoning, other_harmful_factors, aggravating_factors다.
#   자세(bad_posture) 컬럼은 전문 검색 대상이 아니다.
# - 주의: 전문 검색은 단어가 '언급'된 사례를 찾는다. 요인이 '실제로 있었다'는 보장은 아니다.
#   측정: '중량물' 언급 17,215건 중 97.8%가 구조화 컬럼 heavy_lifting='Y'와 일치하고 부정 표현 동반은 16건이었다.
#   다른 요인은 이런 대조 컬럼이 없어 검증하지 못했다. 구조화 컬럼이 있는 요인(중량물 취급 heavy_lifting,
#   부담 부위 burden_body_part)은 후속으로 구조화 필터를 쓰면 더 정확하다.
# - 요인 묶음과 용어는 작성자의 판단이므로 전문가 검토가 필요하다.
match: fts
min_hits: 20
concepts:
  반복 동작:
    db: [반복, 반복적인, 반복적으로, 반복적, 반복되는, 반복성, 반복작업]
    colloquial: [반복 작업, 반복적인 동작, 같은 동작 반복, 반복 업무]
  중량물 취급:
    db: [중량물, 중량물을, 중량물의, 중량]
    colloquial: [무거운 물건, 무거운 짐, 무거운 물건 들기, 중량물 운반]
  물건 운반:
    db: [운반, 자재운반, 상차하차, 상하차, 상차, 하차, 적재]
    colloquial: [짐을 나르기, 운반 작업, 상하차 작업, 자재 운반]
    # 상하차·적재는 job_name(물류 노동자)과 겹쳐서 이쪽 동의어에서 뺐다. 건수 측정에는 그대로 쓴다.
    exclude_synonyms: [상하차, 적재]
  부적절한 자세:
    db: [부적절한 자세, 부자연스러운 자세, 불안정한 자세, 작업자세, 부적절한 작업자세]
    colloquial: [불편한 자세, 자세 불량, 무리한 자세, 나쁜 자세]
  쪼그려 앉기:
    db: [쪼그려, 쪼그려서, 쪼그리고]
    colloquial: [쪼그려 앉기, 쪼그리고 앉기, 쪼그려 작업]
  허리 굽힘:
    db: [허리 굴곡, 요추 굴곡, 허리 굽힘, 굽힌, 굽히고, 굽혀]
    colloquial: [허리 굽히기, 허리 숙임, 허리 굽혀서 작업, 허리 숙이기]
  팔 거상:
    db: [거상]
    colloquial: [팔 들기, 팔 올림, 머리 위 작업, 어깨 위 작업, 팔을 들어올리는 작업]
  몸통 비틀림:
    db: [비틀림, 비틀기]
    colloquial: [허리 비틀기, 몸통 비틀기, 허리 비틀림]
  진동 노출:
    db: [진동, 진동공구]
    colloquial: [진동 공구, 전동 공구, 진동 작업]
  소음 노출:
    db: [소음]
    colloquial: [시끄러운 환경, 소음 작업]
  분진 노출:
    db: [분진, 먼지]
    colloquial: [먼지 작업, 분진 작업, 먼지가 많은 환경]
  석면 노출:
    db: [석면]
    colloquial: [석면 작업, 석면 해체]
    # '석면'은 disease_name의 대표 엔트리와 겹쳐서 이쪽 동의어에서 뺐다.
    exclude_synonyms: [석면]
  유리규산 노출:
    db: [유리규산, 규산, 실리카]
    colloquial: [규소, 석영 분진]
  야간·교대근무:
    db: [야간, 교대제, 교대근무, 교대, 심야, 야간근무]
    colloquial: [야간 작업, 밤샘 근무, 교대 근무, 3교대, 야간 근무]
  장시간 근무:
    db: [장시간, 과로, 만성과로, 업무량, 연장근무, 초과근무]
    colloquial: [오래 일함, 과다 근무, 야근, 초과 근무, 연장 근무]
  업무 스트레스:
    db: [스트레스, 정신적, 괴롭힘]
    colloquial: [직장 스트레스, 직장 내 괴롭힘, 정신적 부담, 갑질]
  좁은 작업공간:
    db: [협소한, 좁은, 협소, 밀폐]
    colloquial: [좁은 공간, 협소한 공간, 밀폐 공간, 좁은 곳]
  오르내리기:
    db: [오르내리기, 계단, 사다리]
    colloquial: [계단 오르내리기, 사다리 작업, 계단 이동]
  급격한 업무 변화:
    db: [급격한 변화, 급격한 업무환경, 돌발, 돌발적]
    colloquial: [갑작스러운 업무 증가, 업무 변화, 갑작스러운 변화]
  망치질·타격:
    db: [망치질, 타격, 해머]
    colloquial: [망치 작업, 해머 작업]
  장시간 운전:
    db: [운전]
    colloquial: [운전 작업, 장시간 운전, 운전 업무]
  고온·한랭 환경:
    db: [고온, 한랭, 추위, 폭염, 더위]
    colloquial: [더운 환경, 추운 환경, 추운 곳, 더운 곳]
  화학물질 노출:
    db: [화학물질, 유기용제, 벤젠, 톨루엔, 용제]
    colloquial: [화학 물질, 유해 화학물질, 유기 용제, 시너]
  용접 흄:
    db: [흄, 용접흄]
    colloquial: [용접 연기, 용접 가스]
  서서 일하기:
    db: [서서, 입식, 선 자세]
    colloquial: [서서 작업, 장시간 서서, 서 있는 작업]
  컴퓨터 작업:
    db: [컴퓨터, 마우스, 키보드]
    colloquial: [컴퓨터 사용, 마우스 사용, 키보드 작업, PC 작업]
