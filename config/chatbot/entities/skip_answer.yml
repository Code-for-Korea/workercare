# skip_answer 엔티티 사전 ('모르겠어요' 답)
#
# 생성: ENTITY=skip_answer bin/rails chatbot:entities:build
#
# - 단계별 사례 찾기에서 질문에 '모르겠어요'로 답하면 그 단계의 값을 비우고 다음 질문으로 넘어간다.
#   단계마다 같은 엔티티를 쓰므로 모든 단계 블록의 그룹 파라미터에 [그 단계 엔티티, skip]으로 넣는다.
# - match: static — DB 컬럼이 없는 고정 목록이라 건수를 재지 않는다.
# - 다른 엔티티와 같은 표현을 겹쳐 넣으면 카카오가 인식을 못 하므로 chatbot:entities:check가 막는다.
#   판정 결과의 '전체' 동의어(모두·전부·상관없음·아무거나·다 보여줘)는 일부러 여기에 넣지 않았다.
match: static
concepts:
  모름:
    colloquial: [모르겠어요, 몰라요, 잘 모르겠어요, 잘 몰라요, 모르겠음, 모르겠다, 모르겠습니다, 패스, 건너뛰기, 넘어가기, 스킵]
