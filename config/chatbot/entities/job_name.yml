# job_name 엔티티 사전 (직종)
#
# 생성: ENTITY=job_name bin/rails chatbot:entities:build
# 미등록 직종 찾기: ENTITY=job_name bin/rails chatbot:entities:discover
#
# - 서버는 job_name을 LIKE 부분 일치로 검색한다. db에는 '핵심어'(조리, 용접, 미화 ...)를 적는다.
#   핵심어 하나가 조리원·조리사·급식조리·주방조리 같은 변형을 모두 포함하기 때문이다.
# - 대표 엔트리는 사람이 읽기 쉬운 이름이다. 한 개념에 핵심어가 여럿이면(예: 청소·미화)
#   서버 검색 확장 전에는 대표 엔트리 하나로만 검색되어 재현율이 떨어진다(리포트의 재현율 열).
# - 직종 이름은 25,000여 가지로 긴 꼬리 분포라 사전이 전부를 덮지는 못한다.
#   '건설 및 광업 단순 종사원' 같은 직업분류 항목명은 사용자가 말하는 표현이 아니라 넣지 않았다.
# - 직종 묶음(예: 조리와 주방, 택시와 버스)은 작성자의 판단이므로 전문가 검토가 필요하다.
