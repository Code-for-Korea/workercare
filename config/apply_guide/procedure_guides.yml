ko:
  application: |
    ## 신청 절차

    1. 산재 지정병원 방문 → 원무과에서 최초요양급여신청 대행 요청
       - 산재보험 의료기관은 근로자 동의 하에 신청 대행 가능 (산재보험법 제41조 제2항)
       - 신청서에 사업주 확인(날인)을 받지 않아도 신청할 수 있음 (사업주 확인 폐지는 2017~2018년 서식 개정 때로 알려져 있음)
       - 사업주 동의 없이 신청해도 공단이 사업주에게 신청 사실을 알리고 의견을 들은 뒤 처리함 (산재보험법 시행규칙 제20조)
    2. 서류 작성: 최초요양신청서 — 재해 경위를 **6하 원칙**에 따라 상세히 기재
    3. 근로복지공단 제출: 관할 지역본부 또는 지사
    4. 업무상질병판정위원회 심의 (질병의 경우): 접수 후 20일 이내 심의 (1차 10일 연장 가능)
    5. 처리 결과 통보: 접수 후 7일 이내 지급 여부 결정 → 신청인 및 사업주 통보

    ⚠️ 본 안내는 참고용이며, 최종 판단은 산업재해보상보험재심사위원회와 법원이 합니다.

  required_documents: |
    ## 필요 서류

    | 서류 | 작성 주체 | 비고 |
    |---|---|---|
    | 요양급여신청서 | 신청인 | 사업주 날인 불필요 |
    | 요양급여신청소견서 | 의료기관 (주치의) | 필수 |
    | 초진소견서 | 의료기관 | |
    | 재해발생경위 서류 | 신청인 | 6하 원칙 상세 기재 |
    | 의무기록사본 및 영상자료 | 의료기관 | X-ray, MRI, CT 등 |
    | 업무 관련 입증자료 | 신청인 | 근무이력, 근로시간, 업무 환경 등 |
    | 10년 치 요양급여내역 | 국민건강보험공단 | |
    | 건강검진내역 | 사업장/병원 | |

    ⚠️ 본 안내는 참고용이며, 최종 판단은 산업재해보상보험재심사위원회와 법원이 합니다.

  rejection_appeal: |
    ## 불인정 시 대응 절차

    1. **심사청구**: 근로복지공단의 결정에 불복하면 결정이 있음을 안 날부터 **90일 이내**에 청구 (공단 심사위원회가 판단)
    2. **재심사청구**: 심사청구 결정에도 불복하면 결정이 있음을 안 날부터 **90일 이내**에 산업재해보상보험재심사위원회(고용노동부)에 청구
       - 업무상질병판정위원회의 심의를 거친 결정은 **심사청구를 거치지 않고 바로** 재심사를 청구할 수 있음 (산재보험법 제106조 단서)
    3. **행정소송**: 재심사 결정에도 불복하면 법원에 소송 (산재보험법상 보험급여 결정에는 행정심판법에 따른 행정심판을 제기할 수 없음, 제103조)

    청구 기간이 지나면 처분이 확정되어 다툴 수 없게 되므로 결정 통지서를 받은 날짜를 기록해 두세요.

    > **판례 참고**: 사전 질환력이 있더라도 업무가 질병을 악화시킨 경우 업무상 재해로 인정될 수 있음 (대법원 판례)

    ⚠️ 본 안내는 참고용이며, 최종 판단은 산업재해보상보험재심사위원회와 법원이 합니다.

  compensation_types: |
    ## 수급 가능한 보험급여

    - **요양급여**: 치료비, 입원비 등
    - **휴업급여**: 평균임금의 70% (3일 초과 시 지급)
    - **장해급여**: 치유 후 장해가 남은 경우 (연금 또는 일시금)
    - **간병급여**: 상시/수시 간병 필요 시
    - **상병보상연금**: 요양 2년 후 중증 1-3급 해당 시

    ⚠️ 본 안내는 참고용이며, 최종 판단은 산업재해보상보험재심사위원회와 법원이 합니다.

  timeline: |
    ## 처리 기간

    | 단계 | 기간 | 비고 |
    |---|---|---|
    | 접수 | 즉시 | 관할 지사 또는 온라인 |
    | 업무상질병판정위원회 심의 | 20일 이내 | 1차 10일 연장 가능 |
    | 처리 결과 통보 | 접수 후 7일 이내 | 지급 여부 결정 |
    | 심사청구 | 결정을 안 날부터 90일 이내 | 공단은 청구서를 받은 날부터 60일 이내 결정 |
    | 재심사청구 | 심사청구 결정을 안 날부터 90일 이내 | 업무상질병판정위원회 심의를 거친 결정은 심사청구 없이 바로 가능 |

    ⚠️ 본 안내는 참고용이며, 최종 판단은 산업재해보상보험재심사위원회와 법원이 합니다.
